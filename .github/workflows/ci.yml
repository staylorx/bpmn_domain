name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  analyze-test:
    name: Analyze & test (Dart ${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Multi-SDK floor (bible §9 step 10): exercise the declared minimum
        # SDK (3.10.0) AND latest stable so the floor is actually held and
        # forward drift is caught. Both rows must pass analyze/format/test.
        sdk: [3.10.0, stable]
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Resolve dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos --fatal-warnings

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Test
        run: dart test
