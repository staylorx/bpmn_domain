name: bpmn_domain
description: >
  A clean-architecture domain model for BPMN 2.0 Workflow DSL processes.
  Provides rich, immutable domain entities for processes, activities, events,
  gateways, data objects, sequence flows and conformance constructs — ready
  for a parser / interpreter layer above.
repository: https://github.com/staylorx/bpmn_domain
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  equatable: ^2.0.7
  fpdart: ^1.2.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
  mocktail: ^1.0.4
  shouldly: ^0.5.0+1
  melos: ^8.8.0

melos:
  # Topology C (single-package workspace): the root pubspec is itself the only
  # package, so it acts as its own melos workspace without a workspace: list.
  useRootAsPackage: true
  scripts:
    analyze:
      description: Run static analysis on the package (matches the CI gate)
      run: dart analyze --fatal-infos --fatal-warnings

    format:
      description: Check formatting (no changes applied)
      run: dart format --output=none --set-exit-if-changed .

    format:fix:
      description: Apply dart format
      run: dart format .

    test:
      description: Run tests across the package
      run: dart test
      concurrency: 1
      failFast: true

    clean:
      description: Clean the workspace then re-bootstrap
      steps:
        - melos clean
        - melos bs

    clean:deep:
      description: Nuclear clean — removes everything not tracked by git (git clean -fdx), then re-bootstraps
      steps:
        - git clean -fdx
        - melos bs

    verify:
      description: Run all checks (analyze, format, test) for CI
      steps:
        - melos run analyze
        - melos run format
        - melos run test
