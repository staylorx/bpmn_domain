include: package:lints/recommended.yaml
analyzer:
  strong-mode:
    implicit-casts: false
    implicit-dynamic: false

  exclude:
    - build/**

  language:
    strict-casts: true
    strict-raw-types: true

  # Bible §2.2: no config-level suppressions. dead_code (and all other
  # diagnostics) run at their default severity; genuine dead code is
  # removed, never downgraded. todo is an error so TODOs can't survive.
  errors:
    missing_return: error
    todo: error

linter:
  rules:
    - always_declare_return_types
    - annotate_overrides
    - cancel_subscriptions
    - close_sinks
    - avoid_print
    - prefer_const_constructors
